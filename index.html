<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanban Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- =========================
             NAVIGATION
        ========================= -->

        <nav>

            <div class="left">
                Kanban
            </div>

            <div class="right">

                <button id="add-task-btn">
                    Add New Task
                </button>

            </div>

        </nav>


        <!-- =========================
             KANBAN BOARD
        ========================= -->

        <section class="board">


            <!-- =========================
                 TO DO
            ========================= -->

            <div id="todo" class="task-column">

                <div class="heading">

                    <div class="left">
                        To Do
                    </div>

                    <div class="right">
                       0
                    </div>

                </div>


                <!-- Existing Task -->

                <div draggable="true" class="task">

                    <h2>
                        Task 1
                    </h2>

                    <p>
                        Description for Task 1
                    </p>

                    <button>
                        Delete
                    </button>

                </div>

            </div>


            <!-- =========================
                 IN PROGRESS
            ========================= -->

            <div id="progress" class="task-column">

                <div class="heading">

                    <div class="left">
                        In Progress
                    </div>

                    <div class="right">
                       0
                    </div>

                </div>

            </div>


            <!-- =========================
                 DONE
            ========================= -->

            <div id="done" class="task-column">

                <div class="heading">

                    <div class="left">
                        Done
                    </div>

                    <div class="right">
                       0
                    </div>

                </div>

            </div>


        </section>


        <!-- =========================
             MODAL
        ========================= -->

        <div class="modal">

            <div class="center">

                <input
                    id="task-title-input"
                    type="text"
                    placeholder="Task Title"
                >


                <textarea
                    id="task-desc-input"
                    placeholder="Task Description"
                ></textarea>


                <select id="task-status">

                    <option value="todo">
                        To Do
                    </option>

                    <option value="progress">
                        In Progress
                    </option>

                    <option value="done">
                        Done
                    </option>

                </select>


                <button id="add-task-btn-modal">
                    Add Task
                </button>

            </div>


            <!-- Modal Background -->

            <div class="bg"></div>

        </div>


    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
